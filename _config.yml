name: zeux.io
url: https://zeux.io
markdown: kramdown
permalink: /:year/:month/:day/:title/
gems:
  - jekyll-redirect-from
kramdown:
  input: GFM
include: [ "/.well-known" ]
collections:
  bits:
    output: true
    permalink: /bits/:year/:month/:day/:title/
defaults:
  - scope:
      type: posts
    values:
      layout: post
  - scope:
      type: bits
    values:
      layout: post
